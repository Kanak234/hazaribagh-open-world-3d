name: CI

# Build the browser game using the exact package scripts defined by the project.
# No game server, network ingestion, or runtime session is started by CI.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      # package-lock.json is committed, so npm ci keeps dependency resolution reproducible.
      - name: Install dependencies
        run: npm ci

      # The project's own build command runs TypeScript followed by Vite bundling.
      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test
